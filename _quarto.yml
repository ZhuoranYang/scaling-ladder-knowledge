    - configs/data/nemotron-cc-index/*.json
    - configs/data/nemotron-cc-index/*.jsonl
    - configs/data/nemotron-cc-index/*.urls
  render:
    - doc/index.qmd
    - doc/reading/*.qmd
    - doc/reading/scientific-scaling-ladder.md
    - doc/workflow/*.qmd
    - doc/plans/*.qmd
    - doc/architecture/*.qmd
    - doc/data/*.qmd
    - doc/optimizers/*.qmd
    - doc/training/*.qmd
    - doc/evaluation/*.qmd
    - doc/efforts/*.qmd
    - doc/papers/*.qmd
    - doc/deep-dives/*.qmd
    - doc/experiments/*.qmd
    - doc/sources/*.qmd
    - references/README.md
    - references/SOURCES.md
    - references/MARIN-READING.md
