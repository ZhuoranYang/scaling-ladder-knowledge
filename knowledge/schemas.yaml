version: 1
scope: pretraining-science
literature_root: references
layers:
  sources: frozen source cards; raw papers, LaTeX and code remain in references
  wiki: synthesized scientific knowledge with claim-level provenance
  queries: generated indices; never hand edit
common_required:
- id
- title
- type
- tags
- sources
- architectures
page_types:
  source-doc:
    prefix: doc-
    required:
    - url
    - source_category
    - retrieved_at
    - version
    - local_artifacts
    - review_status
  source-pr:
    prefix: pr-
    required:
    - repo
    - pr
    - author
    - url
    - captured_at
    - status
    - merged
    - head_sha
    - local_artifacts
    - review_status
    - source_category
    - date
  source-dataset:
    prefix: dataset-
    required:
    - url
    - source_category
    - retrieved_at
    - version
    - local_artifacts
    - review_status
  source-model:
    prefix: model-
    required:
    - url
    - source_category
    - retrieved_at
    - version
    - local_artifacts
    - review_status
  source-issue:
    prefix: issue-
    required:
    - url
    - source_category
    - retrieved_at
    - version
    - local_artifacts
    - review_status
  wiki-foundation:
    prefix: foundation-
    required:
    - confidence
    - reproducibility
    - reproducibility_scope
    - related
    - prerequisites
    - claims
    - version_sensitive
  wiki-technique:
    prefix: technique-
    required:
    - confidence
    - reproducibility
    - reproducibility_scope
    - related
    - prerequisites
    - claims
    - code_examples
    - version_sensitive
    min_reproducibility: snippet
  wiki-pattern:
    prefix: pattern-
    required:
    - confidence
    - reproducibility
    - reproducibility_scope
    - symptoms
    - candidate_techniques
    - related
    - prerequisites
    - claims
    - version_sensitive
  wiki-case-study:
    prefix: case-
    required:
    - confidence
    - reproducibility
    - reproducibility_scope
    - related
    - prerequisites
    - claims
    - performance_claims
    - code_examples
    - version_sensitive
    min_reproducibility: snippet
  wiki-recipe:
    prefix: recipe-
    required:
    - confidence
    - reproducibility
    - reproducibility_scope
    - related
    - prerequisites
    - claims
    - code_examples
    - version_sensitive
    min_reproducibility: snippet
  wiki-governance:
    prefix: governance-
    required:
    - confidence
    - reproducibility
    - reproducibility_scope
    - related
    - prerequisites
    - claims
    - version_sensitive
  source-blog:
    prefix: blog-
    required:
    - author
    - url
    - source_category
    - retrieved_at
    - version
    - local_artifacts
    - review_status
confidence:
- verified
- source-reported
- inferred
- experimental
reproducibility:
- concept
- pseudocode
- snippet
- runnable
- benchmarked
verification:
- source_read
- artifact_inspected
- cpu_replayed
- training_reproduced
claim_kinds:
- reported_configuration
- reported_measurement
- code_behavior
- source_status
- artifact_check
- analytical_derivation
- proposal
claim_required:
- id
- statement
- kind
- sources
- locators
- scope
- limitations
- verification
- versions
- measurements
claim_scope_required:
- model
- data
- optimizer
- horizon
- evaluation
performance_required:
- claim_id
- metric
- value
- unit
- model
- data
- compute
- optimizer
- evaluation
- baseline
- uncertainty
- source_id
- source_locator
verified_requires:
- official_sources
- upstream_code
