name: Knowledge contracts and CPU replays
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-kb.txt
      - run: python scripts/kb_workbench.py --all --check
      - run: python scripts/kb.py validate --verify-artifacts --check-generated
      - run: python -m unittest discover -s tests -p 'test_kb*.py'
      - run: python -S scripts/kb.py query 'muP batch' --type technique
